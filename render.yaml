services:
  - type: web
    name: surveymind-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: CORS_ALLOWED_ORIGINS
        value: http://127.0.0.1:5500,http://localhost:5500
